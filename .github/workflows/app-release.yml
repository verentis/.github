name: Verentis app release

# Trunk-based production release for app repositories. Call it from the repository's push-to-main workflow; tests
# belong to the pull request, so this path only builds, packages and deploys. For every changed hosted app the image
# is built once (`build` environment) and the same digest is deployed directly to the production regions, one at a
# time. After every hosted app is deployed, each changed package is published with the repository's GitVersion version
# (resolve-version: last v<version> tag plus one patch; the run tags the commit v<version>) to the global production
# registry, which distributes it to the regions. Package assets are built once (build-verentis-package-assets.yml) and
# packed from that artifact; publishing an identical package again (a re-run) is a no-op. A re-run of a failed deploy
# or publish job never rebuilds.

on:
  workflow_call:
    inputs:
      build-target:
        description: Package asset build (empty, root, or an npm workspace) before packing
        required: false
        default: ''
        type: string
      visibility:
        required: false
        default: Public
        type: string
      shared-paths:
        description: Newline-separated path prefixes that affect every package and hosted app
        required: false
        default: |-
          .github/
          package.json
          package-lock.json
        type: string
      production-targets:
        description: JSON list of production GitHub environments in rollout order (first region first)
        required: false
        default: '["production-eus", "production-nz", "production-za"]'
        type: string
      everything:
        description: Ship every package and hosted app regardless of what changed (manual runs)
        required: false
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  delivery-disabled:
    if: vars.APP_DELIVERY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: >-
          echo "::notice::App delivery is disabled for this repository. The platform's bootstrap-app-repos workflow
          creates its environments and identities and then sets the repository variable APP_DELIVERY_ENABLED=true."

  plan:
    if: vars.APP_DELIVERY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      hosted: ${{ steps.plan.outputs.hosted }}
      has-packages: ${{ steps.plan.outputs.has-packages }}
      has-hosted: ${{ steps.plan.outputs.has-hosted }}
      version: ${{ steps.version.outputs.version }}
      cli-version: ${{ steps.cli.outputs.cli-version }}
    permissions:
      contents: write  # resolve-version pushes the release tag v<version>
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: base
        env:
          BEFORE: ${{ github.event.before }}
          EVERYTHING: ${{ inputs.everything }}
        run: |
          set -euo pipefail
          if [[ "$EVERYTHING" == true || -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$BEFORE" >> "$GITHUB_OUTPUT"
          fi
      - id: plan
        uses: verentis/.github/.github/actions/plan-delivery@main
        with:
          base-sha: ${{ steps.base.outputs.sha }}
          shared-paths: ${{ inputs.shared-paths }}
      - id: version
        if: steps.plan.outputs.has-packages == 'true' || steps.plan.outputs.has-hosted == 'true'
        uses: verentis/.github/.github/actions/resolve-version@main
        with:
          mode: release
      - id: cli
        # Every target of this release packs with the same CLI.
        run: echo "cli-version=$(npm view @verentis/cli version)" >> "$GITHUB_OUTPUT"

  hosted:
    needs: plan
    if: needs.plan.outputs.has-hosted == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.hosted) }}
    uses: verentis/.github/.github/workflows/hosted-app-ship.yml@main
    with:
      app: ${{ matrix.app }}
      mode: release
      production-targets: ${{ inputs.production-targets }}
    secrets: inherit

  assets:
    needs: plan
    if: needs.plan.outputs.has-packages == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.packages) }}
    uses: verentis/.github/.github/workflows/build-verentis-package-assets.yml@main
    with:
      package-root: ${{ matrix.package-root }}
      build-target: ${{ inputs.build-target }}
    secrets: inherit

  publish-production:
    needs: [plan, hosted, assets]
    # A package is published only once the hosted apps it points at are deployed.
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.has-packages == 'true'
      && needs.assets.result == 'success'
      && (needs.hosted.result == 'success' || needs.hosted.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.packages) }}
    uses: verentis/.github/.github/workflows/publish-verentis-package-target.yml@main
    with:
      target: production
      package-root: ${{ matrix.package-root }}
      manifest: ${{ matrix.manifest }}
      version: ${{ needs.plan.outputs.version }}
      visibility: ${{ inputs.visibility }}
      prebuilt-assets: true
      cli-version: ${{ needs.plan.outputs.cli-version }}
    # Environment secrets (signing key) must be passed through every reusable-workflow hop.
    secrets: inherit
