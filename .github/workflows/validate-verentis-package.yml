name: Validate Verentis package

on:
  workflow_call:
    inputs:
      package-root:
        description: Package root relative to the repository
        required: true
        type: string
      manifest:
        description: Manifest path relative to the package root
        required: true
        type: string
      overlay:
        description: Optional overlay path relative to the package root
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Verentis CLI
        run: npm install --global @verentis/cli --registry=https://registry.npmjs.org --@verentis:registry=https://registry.npmjs.org

      - name: Validate package
        working-directory: ${{ inputs.package-root }}
        env:
          MANIFEST: ${{ inputs.manifest }}
          OVERLAY: ${{ inputs.overlay }}
        run: |
          set -euo pipefail
          test -f "$MANIFEST"
          # A manifest whose deployable values (entry, hosts) live only in non-local overlays is never published
          # bare, so the bare manifest is validated only when there are no such overlays.
          overlays=()
          for file in environments/*.yaml; do
            [[ -f "$file" && "$file" != environments/local.yaml ]] && overlays+=("$file")
          done
          if (( ${#overlays[@]} == 0 )); then verentis validate "$MANIFEST"; fi
          if [[ -n "$OVERLAY" ]]; then verentis validate "$MANIFEST" --overlay "$OVERLAY"; fi
          # Every environment overlay must validate. Overlay parameters get sample values; real ones come from the
          # target at publish time (see publish-verentis-package-target.yml).
          sample=(--param app-host=sample-pr-1.apps.feature.verentis.dev --param apps-domain=apps.feature.verentis.dev --param host-suffix=-pr-1)
          for file in environments/*.yaml; do
            [[ -f "$file" ]] || continue
            env_name=$(basename "$file" .yaml)
            echo "Validating overlay $env_name"
            verentis validate "$MANIFEST" --env "$env_name" "${sample[@]}"
          done
